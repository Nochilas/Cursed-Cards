<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Cursed Cards – Game</title>

    <!-- Alpine -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <!-- SignalR -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr/dist/browser/signalr.min.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./game.css">
</head>

<body>
    <div class="container" x-data="game()" x-init="init()">
        <h1 class="title">Cursed Cards – Round</h1>

        <div class="room-info" x-text="`Stanza: ${roomId}`"></div>
        <div class="czar-info" x-text="`Czar: ${czar ?? '—'}`"></div>

        <!-- Black Card -->
        <div class="black-card" x-text="blackCard || 'No black card'"></div>

        <!-- Czar controls -->
        <div class="czar-controls" x-show="isCzar">
            <button class="czar-btn" @click="drawBlack" :disabled="blackCard || roundStatus !== 0">
                Draw black card
            </button>

            <button class="czar-btn" @click="startRound" :disabled="!blackCard || roundStatus !== 0">
                Start round
            </button>
        </div>

        <!-- Player hand -->
        <template x-if="!isCzar">
            <div>
                <h2>Your cards</h2>
                <div class="hand">
                    <template x-for="card in hand" :key="card">
                        <div class="card" :class="{ selected: selectedCards.includes(card) }" @click="toggleCard(card)"
                            x-text="card">
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Selected cards -->
        <template x-if="!isCzar">
            <div>
                <button class="submit-btn" :disabled="selectedCards.length !== blanksRequired || !canSubmit"
                    @click="submitCards">
                    Submit
                </button>
            </div>
        </template>

        <!-- Czar reveal -->
        <div x-show="czarRevealing">
            <button class="czar-btn" @click="revealNext" x-text="revealIndex === 0 ? 'Show Cards' : 'Next'">
            </button>
            <div class="czar-controls">
                <template x-for="c in currentReveal" :key="c">
                    <div class="revealed-card" x-text="c"></div>
                </template>
            </div>
        </div>

        <!-- Czar pick winner -->
        <template x-if="czarPicking">
            <div>
                <h3>Select the winning answer</h3>

                <template x-for="[player, cards] in shuffledPlayedCards" :key="player">
                    <button class="czar-choice-btn" @click="selectWinner(player)" x-text="cards.join(' | ')">
                    </button>
                </template>
            </div>
        </template>

        <!-- Winner banner -->
        <div x-show="showWinnerBanner" class="winner-banner">
            Winner: <strong x-text="winnerMessage"></strong>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <h3>Scores</h3>
            <ul>
                <template x-for="(score, player) in scores" :key="player">
                    <li x-text="`${player}: ${score}`"></li>
                </template>
            </ul>
        </div>

    </div>

    <script src="./game.js"></script>
</body>

</html>
