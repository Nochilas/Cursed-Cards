<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Join Game - Cursed Cards</title>

    <!-- Alpine -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" x-data="joinGame()" x-init="init()">
        <h1 class="title">Join Game</h1>

        <div class="subtitle" x-text="roomText"></div>

        <input class="input" type="text" placeholder="Enter your username" x-model="playerName"
            :disabled="loading || joined">

        <button class="btn" @click="join" :disabled="loading || joined">
            <span x-show="!loading">Join</span>
            <span x-show="loading">Connecting...</span>
        </button>

        <div class="result" x-show="error" x-text="error"></div>
    </div>

    <script src="join.js"></script>
</body>

</html>
