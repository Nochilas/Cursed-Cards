<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <title>Cursed Cards – Lobby</title>

    <!-- Alpine -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <!-- SignalR -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr/dist/browser/signalr.min.js"></script>

    <link rel="stylesheet" href="./lobby.css" />
</head>

<body>
    <div class="container" x-data="lobby()" x-init="init()">
        <h1 class="title">Lobby</h1>

        <div class="room-info" x-text="`Room: ${roomId}`"></div>

        <div class="players-section">
            <h2>Players</h2>
            <ul class="players-list">
                <template x-for="p in players" :key="p">
                    <li x-text="p"></li>
                </template>
            </ul>
        </div>

        <div class="czar-section">
            <p class="czar-label" x-text="czar ? `Czar: ${czar}` : 'Czar: —'"></p>
        </div>

        <!-- Start game: only czar -->
        <button class="start-btn" x-show="isCzar" @click="startGame">
            Start Game
        </button>
    </div>

    <script src="./lobby.js"></script>
</body>

</html>
